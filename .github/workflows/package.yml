name: Publish Docker package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (for example v0.1.0-preview.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Find the published release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^v\d+\.\d+\.\d+(?:-[a-zA-Z0-9]+(?:[.-][a-zA-Z0-9]+)*)?$/.test(tag)) {
              throw new Error('Choose a release tag such as v0.1.0-preview.1 or v0.1.0.');
            }
            const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            if (data.draft) throw new Error('Publish the release before publishing its package.');
            core.setOutput('tag', tag);
            core.setOutput('version', tag.slice(1));
            core.setOutput('image', `ghcr.io/${context.repo.owner}/${context.repo.repo}`.toLowerCase());
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false
      - name: Record the exact source commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    needs: release
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.release.outputs.sha }}

  publish:
    needs: [release, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.release.outputs.image }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - name: Include release license notices in the package
        # Also supports the first release, whose Dockerfile predates packaging.
        run: |
          cp Dockerfile Dockerfile.package
          printf '\nCOPY LICENSE NOTICE /app/\n' >> Dockerfile.package
      - name: Set up ARM builds
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Sign in to GitHub Packages
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace an existing version
        shell: bash
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /tmp/package-manifest 2>/tmp/package-error; then
            echo 'This package version already exists. Publish a new release for changes.' >&2
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|not found' /tmp/package-error; then
            cat /tmp/package-error >&2
            exit 1
          fi
      - name: Build and publish Intel/AMD and ARM images
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.package
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=refresh
            org.opencontainers.image.description=Self-hosted photo reconstruction distilled from refresh.stream
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://refresh.stream
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ needs.release.outputs.sha }}
          provenance: mode=min
          sbom: true
      - name: Write download details
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Docker package published'
            echo
            echo "Version: \`$IMAGE:$VERSION\`"
            echo
            echo "Exact image: \`$IMAGE@$DIGEST\`"
            echo
            echo 'Includes linux/amd64 and linux/arm64. Model weights and the GPU image server are separate.'
            echo
            echo 'First publication: open the package settings and set visibility to Public so users can download without signing in.'
          } >> "$GITHUB_STEP_SUMMARY"
